[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seamsh"
# The version and the C library (seamsh/libseamsh.so) are defined in setup.py.
dynamic = ["version"]
description = "Ocean mesh generation"
readme = "README.rst"
# seamsh as a whole: see LICENSE.txt (upstream's files are LGPL-3.0-or-later, the files from gmsh GPL).
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.txt",
    "COPYING.txt",
    "COPYING.LESSER.txt",
    "AUTHORS.txt",
    "seamshlib/LICENSE.gmsh.txt",
]
authors = [
    { name = "Jonathan Lambrechts", email = "jonathan.lambrechts@uclouvain.be" },
    { name = "Stefano Campanella" },
]
# This fork (upstream: Jonathan Lambrechts, UCLouvain; see [project.urls]).
maintainers = [{ name = "Stefano Campanella" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "gdal>=3.1.0", "gmsh", "tqdm"]
classifiers = [
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# gmsh.convert_to_ugrid_mesh_file
ugrid = ["xarray", "netcdf4"]

# Tools, not features: dependency groups (PEP 735, `pip install --group dev`, pip >= 25.1), as in moby-dick.
[dependency-groups]
dev = [
    "coverage[toml] >= 7.17",
    "pre-commit >= 4.7",
    "pytest >= 9",
    "pytest-cov >= 7.1",
    # Pinned: the rules enabled by default and the formatter's output change between versions; keep in sync with
    # .pre-commit-config.yaml (and with moby-dick).
    "ruff == 0.17.3",
    "ty == 0.0.97",
    # Type stubs for ty. scipy-stubs tracks scipy's version: keep it compatible with the scipy in use.
    "scipy-stubs",
    "types-tqdm",
]
doc = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx-autodoc-typehints",
    "sphinx-gallery",
    "matplotlib",
    "requests",
]

[project.urls]
Homepage = "https://github.com/stefanocampanella/seamsh"
Documentation = "https://stefanocampanella.github.io/seamsh/"
Issues = "https://github.com/stefanocampanella/seamsh/issues"
Changelog = "https://github.com/stefanocampanella/seamsh/blob/develop/CHANGELOG.rst"
Upstream = "https://git.immc.ucl.ac.be/jlambrechts/seamsh"

[tool.setuptools]
packages = ["seamsh"]

[tool.setuptools.package-data]
seamsh = ["*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import seamsh from the source tree (needs `python setup.py build_ext --inplace` first), not a copy installed in
# the environment (moby-dick's image has one).
pythonpath = [".", "tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    # Deprecations raised in our own code fail the tests, so they are fixed before the libraries remove the APIs.
    "error::DeprecationWarning:seamsh",
    "error::FutureWarning:seamsh",
]

[tool.coverage.run]
source = ["seamsh"]
branch = true

[tool.coverage.report]
show_missing = true
# pytest --cov fails below this total (CI); coverage was 82 % on 12 Nov 2026.
fail_under = 80

[tool.ty.environment]
python-version = "3.12"
# The tests import their helpers (domains.py) as top-level modules.
extra-paths = ["tests"]

# The conventions of moby-dick: 2-space indentation, 120 columns, double quotes.
[tool.ruff]
indent-width = 2
line-length = 120
extend-exclude = ["refactoring-kit", "doc/conf.py"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
# Line length is the formatter's business; it leaves long comments and docstrings alone.
# B905 (zip without strict=): the zips of the code are of equal lengths by construction; adding strict= would only
# change how a bug shows.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
# The examples are tutorials: they fetch their data before importing seamsh.
"examples/*" = ["E402", "SIM115"]

[tool.codespell]
skip = "seamshlib/polymesh.c,seamshlib/polymesh.h,seamshlib/robustPredicates.c,seamshlib/robustPredicates.h,seamshlib/qsort.h,seamshlib/vector.h,COPYING.txt,COPYING.LESSER.txt,seamshlib/LICENSE.gmsh.txt,AUTHORS.txt,refactoring-kit,tests/data,build,*.msh"
