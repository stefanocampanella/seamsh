# Three independent jobs, each with its own status, as in moby-dick:
# - lint: the pre-commit hooks that need no project environment (ruff check, ruff format, codespell, clang-format);
# - reuse: copyright and license of every file (REUSE);
# - tests: ty and the test suite with coverage (pytest --cov, 80 % gate). GDAL and gmsh come from conda-forge (pip
#   has no GDAL wheels), with a C compiler for the library; the tools from the dev group (pyproject.toml).
# Hook versions live in .pre-commit-config.yaml only.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same bound as the dev group (pyproject.toml).
      - name: Install pre-commit
        run: python -m pip install "pre-commit >= 4.7"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Ruff, codespell and clang-format
        # reuse and ty run in their own jobs (ty needs the project's dependencies).
        env:
          SKIP: reuse,ty
        run: pre-commit run --all-files --show-diff-on-failure

  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install "pre-commit >= 4.7"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-reuse-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: REUSE
        run: pre-commit run reuse --all-files

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # A login shell activates the micromamba environment.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: seamsh
          create-args: >-
            --override-channels -c conda-forge
            python=3.12 c-compiler gdal python-gmsh numpy scipy tqdm xarray netcdf4 setuptools pip
          cache-environment: true

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install the dev group and build the C library
        id: install
        run: |
          # Dependency groups need pip >= 25.1.
          python -m pip install --upgrade "pip >= 25.1"
          python -m pip install --group dev
          python setup.py build_ext --inplace

      - name: GDAL, PROJ and gmsh versions
        run: |
          python - <<'EOF'
          import gmsh
          from osgeo import gdal, osr
          proj = ".".join(str(f()) for f in (osr.GetPROJVersionMajor, osr.GetPROJVersionMinor, osr.GetPROJVersionMicro))
          print(f"GDAL {gdal.__version__}, PROJ {proj}, gmsh {gmsh.__version__}")
          EOF

      # A local hook running ty from the environment: nothing to download.
      - name: ty
        run: pre-commit run ty --all-files

      - name: Tests with coverage
        # Also when ty failed (both results are useful), but not without the environment.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest --cov --cov-report=xml --cov-report=term

      - name: Coverage summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [[ -f .coverage ]]; then
            coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      # Coverage history and the README badge. The token is the repository's Codecov upload token (secret
      # CODECOV_TOKEN); an upload error does not fail the job, so an outage of Codecov, or a missing token, cannot
      # block a pull request.
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          files: coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
